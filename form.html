<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>無料で資料をダウンロード｜W</title>
<meta name="description" content="30秒で完了。サービス内容・審査基準・保証の適用条件をまとめた資料をお送りします。">
<meta property="og:title" content="無料で資料をダウンロード｜W">
<meta property="og:description" content="30秒で完了。サービス内容・審査基準・保証の適用条件をまとめた資料をお送りします。">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&amp;display=swap">
<style>
body { margin:0; background:#e0dbd0; color:#1a2420; font-family:"Noto Sans JP", system-ui, -apple-system, sans-serif; font-size:15px; line-height:1.8; -webkit-font-smoothing:antialiased; }
* { box-sizing:border-box; }
a { color:#145041; }
a[style*="background:linear-gradient"]:hover, button:hover { filter:brightness(1.08); }
@keyframes marquee { from { transform:translateX(0); } to { transform:translateX(-50%); } }
@keyframes fadeUp { from { opacity:0; transform:translateY(18px); } to { opacity:1; transform:translateY(0); } }
@keyframes growX { from { transform:scaleX(0); } to { transform:scaleX(1); } }
@keyframes popIn { from { opacity:0; transform:scale(0.85); } to { opacity:1; transform:scale(1); } }
details summary::-webkit-details-marker { display:none; }
details summary { list-style:none; }
:focus { outline:none; }
:focus-visible { outline:2px solid #a3853f; outline-offset:2px; }
input:focus, select:focus { border-color:#a3853f !important; }
.sel { width:100%; font:inherit; font-size:14px; font-weight:500; padding:14px 40px 14px 16px; border:1px solid rgba(38,34,30,0.18); background-color:#f7f5f0; color:#1a2420; cursor:pointer; -webkit-appearance:none; appearance:none; background-image:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='14' height='9' viewBox='0 0 14 9'%3E%3Cpath d='M1 1l6 6 6-6' fill='none' stroke='%23a3853f' stroke-width='2'/%3E%3C/svg%3E"); background-repeat:no-repeat; background-position:right 16px center; border-radius:0; }
.sel:invalid { color:#6a746e; }
.bar-hidden { display:none; }
.hscroll { overflow-x:auto; -webkit-overflow-scrolling:touch; scrollbar-width:none; scroll-snap-type:x mandatory; }
.hscroll::-webkit-scrollbar { display:none; }
.nitte-embed { min-height:720px; width:100%; border:0; display:block; }
@media (max-width: 800px) { .nitte-embed { min-height:600px; } }
@media (prefers-reduced-motion: reduce) { * { animation:none !important; } }
</style>
</head>
<body>
<div style="max-width:430px;margin:0 auto;background:#ffffff;min-height:100vh;box-shadow:0 0 34px rgba(15,68,54,0.18)">

  <header style="display:flex;align-items:center;gap:10px;padding:12px 16px;background:linear-gradient(180deg,#ffffff 0%,#f6faf8 100%);border-bottom:1px solid #dbe8e2">
    <a href="index.html" style="display:block;text-decoration:none"><img src="assets/logo-w-gold.png" alt="W" style="height:24px;width:auto;display:block"></a>
    <div style="font-size:10px;line-height:1.6;color:#5f6f69;font-weight:500">粗利600万円保証付きの<br>営業支援サービス</div>
  </header>

  <div style="background:url(data:image/svg+xml;charset=utf-8,%3Csvg%20xmlns=%27http://www.w3.org/2000/svg%27%20width=%27560%27%20height=%27420%27%20viewBox=%270%200%20560%20420%27%3E%3Cg%20fill=%27none%27%20stroke-width=%271.5%27%3E%3Ccircle%20cx=%27205%27%20cy=%27210%27%20r=%27158%27%20stroke=%27%230f4436%27%20opacity=%270.10%27/%3E%3Ccircle%20cx=%27355%27%20cy=%27210%27%20r=%27158%27%20stroke=%27%23a3853f%27%20opacity=%270.13%27/%3E%3C/g%3E%3Cg%20fill=%27none%27%20stroke-width=%271%27%3E%3Ccircle%20cx=%27205%27%20cy=%27210%27%20r=%27108%27%20stroke=%27%230f4436%27%20opacity=%270.06%27/%3E%3Ccircle%20cx=%27355%27%20cy=%27210%27%20r=%27108%27%20stroke=%27%23a3853f%27%20opacity=%270.08%27/%3E%3C/g%3E%3Ccircle%20cx=%27280%27%20cy=%27210%27%20r=%275%27%20fill=%27%23a3853f%27%20opacity=%270.16%27/%3E%3C/svg%3E) right -180px top -40px/560px 420px no-repeat, radial-gradient(ellipse 430px 310px at 88% -8%,rgba(194,162,94,0.13),transparent 70%), linear-gradient(180deg,#ffffff 0%,#f2faf6 24%,#d7ede2 58%,#b5ddc8 84%,#a1d2b9 100%);padding:40px 24px 44px">
    <div style="display:flex;align-items:center;gap:9px;margin-bottom:12px">
      <span style="width:20px;height:2px;background:linear-gradient(90deg,#c2a25e,rgba(194,162,94,0));flex:none"></span>
      <span style="font-size:10px;font-weight:900;letter-spacing:0.2em;color:#7d6428">資料ダウンロード</span>
    </div>
    <h1 style="font-size:24px;line-height:1.65;margin:0;font-weight:900;color:#0d3f31;letter-spacing:0.02em"><span style="background:linear-gradient(90deg,#c2a25e,#e0c589);background-size:100% 2px;background-repeat:no-repeat;background-position:0 100%;padding-bottom:5px">無料で資料</span>を<br>ダウンロード</h1>
    <p style="font-size:13px;line-height:2.05;color:#3c4d47;margin:18px 0 0">サービス内容・審査基準・保証の適用条件をまとめた資料をお送りします。1営業日以内に担当よりご連絡します。</p>
  </div>

  <div style="padding:34px 24px 48px;background:linear-gradient(180deg,#ffffff 0%,#fafdfc 100%)">
    <form id="wform" style="display:flex;flex-direction:column;gap:22px">
      <div>
        <label for="company" style="display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;margin-bottom:8px;color:#1c2b26">会社名<span style="background:linear-gradient(135deg,#2f8468,#0e4735);color:#fff;font-size:10px;font-weight:700;padding:2px 8px;border-radius:2px">必須</span></label>
        <input id="company" name="company" type="text" required placeholder="例：ラフ・メイカー株式会社" style="width:100%;font:inherit;font-size:15px;padding:14px 16px;border:1px solid rgba(15,68,54,0.16);border-radius:4px;background:#fafdfc;color:#1c2b26">
      </div>
      <div>
        <label for="name" style="display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;margin-bottom:8px;color:#1c2b26">氏名<span style="background:linear-gradient(135deg,#2f8468,#0e4735);color:#fff;font-size:10px;font-weight:700;padding:2px 8px;border-radius:2px">必須</span></label>
        <input id="name" name="name" type="text" required placeholder="例：山田 太郎" style="width:100%;font:inherit;font-size:15px;padding:14px 16px;border:1px solid rgba(15,68,54,0.16);border-radius:4px;background:#fafdfc;color:#1c2b26">
      </div>
      <div>
        <label for="email" style="display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;margin-bottom:8px;color:#1c2b26">メールアドレス<span style="background:linear-gradient(135deg,#2f8468,#0e4735);color:#fff;font-size:10px;font-weight:700;padding:2px 8px;border-radius:2px">必須</span></label>
        <input id="email" name="email" type="email" required placeholder="例：yamada@example.co.jp" style="width:100%;font:inherit;font-size:15px;padding:14px 16px;border:1px solid rgba(15,68,54,0.16);border-radius:4px;background:#fafdfc;color:#1c2b26">
      </div>
      <div>
        <label for="tel" style="display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;margin-bottom:8px;color:#1c2b26">電話番号<span style="background:linear-gradient(135deg,#2f8468,#0e4735);color:#fff;font-size:10px;font-weight:700;padding:2px 8px;border-radius:2px">必須</span></label>
        <input id="tel" name="tel" type="tel" required placeholder="例：03-1234-5678" style="width:100%;font:inherit;font-size:15px;padding:14px 16px;border:1px solid rgba(15,68,54,0.16);border-radius:4px;background:#fafdfc;color:#1c2b26">
      </div>
      <div>
        <label for="budget" style="display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;margin-bottom:8px;color:#1c2b26">予算として年間300万円以上を確保できますか？<span style="background:linear-gradient(135deg,#2f8468,#0e4735);color:#fff;font-size:10px;font-weight:700;padding:2px 8px;border-radius:2px;flex:none">必須</span></label>
        <select id="budget" name="budget" required class="sel">
          <option value="" disabled selected>選択してください</option>
          <option>はい</option>
          <option>いいえ</option>
        </select>
        <p style="font-size:11px;line-height:1.8;color:#8a6f30;margin:8px 0 0">※誠に恐縮ながら、「いいえ」の場合は今回のご案内の対象外となります</p>
      </div>
      <div>
        <label for="issue" style="display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;margin-bottom:8px;color:#1c2b26">現在、貴社が抱えている課題を教えてください<span style="background:linear-gradient(135deg,#2f8468,#0e4735);color:#fff;font-size:10px;font-weight:700;padding:2px 8px;border-radius:2px;flex:none">必須</span></label>
        <select id="issue" name="issue" required class="sel">
          <option value="" disabled selected>選択してください</option>
          <option>売上が伸び悩んでいる／頭打ちになっている</option>
          <option>新規顧客・販路をうまく開拓できていない</option>
          <option>営業の人材・リソースが不足している</option>
          <option>マーケティング・ブランディングのやり方が分からない</option>
          <option>決裁者・キーマンとの人脈・つながりがない</option>
          <option>資金調達・PR・採用・DXなど経営全般に課題がある</option>
        </select>
      </div>
      <div>
        <label for="interest" style="display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;margin-bottom:8px;color:#1c2b26">今回、特に興味を持たれた内容を教えてください<span style="background:linear-gradient(135deg,#2f8468,#0e4735);color:#fff;font-size:10px;font-weight:700;padding:2px 8px;border-radius:2px;flex:none">必須</span></label>
        <select id="interest" name="interest" required class="sel">
          <option value="" disabled selected>選択してください</option>
          <option>いま課題のある決裁者とのマッチング・紹介</option>
          <option>代表・田口のマーケティングスキルを活用できる点</option>
          <option>企業800社・個人10,000社超のビジネス人脈</option>
          <option>ターゲットへのアプローチ代行</option>
          <option>資金調達・PR・人材・DXまで含む経営ブレインサポート</option>
          <option>粗利600万円の最低保証（下振れリスクの固定）</option>
        </select>
      </div>
      <div style="font-size:11px;line-height:1.9;color:#5f6f69;background:linear-gradient(180deg,#f4faf7,#eaf3f0);border:1px solid #dbe8e2;padding:14px 16px">
        送信いただいた情報は、お問い合わせ対応の目的にのみ使用します。詳しくは<a href="https://drive.google.com/file/d/1aoLPsLe9loWZZIPutqbFUnU6kxRVnT5W/view?usp=sharing" target="_blank" rel="noopener">プライバシーポリシー</a>をご確認ください。
      </div>
      <div>
        <div style="display:flex;align-items:center;justify-content:center;gap:11px;margin-bottom:10px">
          <span style="width:2px;height:16px;background:#a3853f;transform:rotate(-20deg);border-radius:1px;flex:none"></span>
          <span style="font-size:12px;font-weight:900;color:#7d6428;letter-spacing:0.06em;white-space:nowrap">30秒で入力完了</span>
          <span style="width:2px;height:16px;background:#a3853f;transform:rotate(20deg);border-radius:1px;flex:none"></span>
        </div>
        <button type="submit" style="font-family:inherit;width:100%;display:flex;align-items:center;justify-content:center;gap:10px;background:linear-gradient(135deg,#2f8468 0%,#1a6350 48%,#0e4735 100%);color:#fff;font-weight:900;font-size:16px;padding:18px 14px;border:none;border-radius:8px;cursor:pointer;line-height:1.5;box-shadow:0 4px 0 #082e1e, 0 14px 26px rgba(15,68,54,0.30), inset 0 1px 0 rgba(255,255,255,0.24)">
          <span>この内容で資料を受け取る</span>
          <span style="flex:none;width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,0.16);border:1px solid rgba(255,255,255,0.55);display:flex;align-items:center;justify-content:center;font-size:13px;line-height:1">&#8594;</span>
        </button>
      </div>
    </form>
    <div style="text-align:center;margin-top:28px">
      <a href="index.html" style="font-size:12px;color:#5f6f69">← LPに戻る</a>
    </div>
  </div>

  <footer style="padding:24px;background:linear-gradient(180deg,#a1d2b9 0%,#8bc3ab 100%);font-size:10px;color:#33604f;text-align:center">© ラフ・メイカー株式会社</footer>
</div>
<script>
(function(){
  var f = document.getElementById('wform');
  if (!f) return;
  f.addEventListener('submit', function(e){
    e.preventDefault();
    if (f.checkValidity()) location.href = 'thanks.html';
    else f.reportValidity();
  });
})();
</script>
</body>
</html>
