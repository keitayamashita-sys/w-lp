<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>紹介できる決裁者がいるか確認する｜W</title>
<meta name="description" content="無料・1分で入力完了。審査結果のご連絡まで費用は一切かかりません。">
<meta property="og:title" content="紹介できる決裁者がいるか確認する｜W">
<meta property="og:description" content="無料・1分で入力完了。審査結果のご連絡まで費用は一切かかりません。">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&amp;display=swap">
<style>
body { margin:0; background:#e4e8ec; color:#1f2933; font-family:"Noto Sans JP", system-ui, -apple-system, sans-serif; font-size:15px; line-height:1.8; -webkit-font-smoothing:antialiased; }
* { box-sizing:border-box; }
a { color:#1a5fa8; }
a[style*="background:linear-gradient"]:hover, button:hover { filter:brightness(1.08); }
@keyframes marquee { from { transform:translateX(0); } to { transform:translateX(-50%); } }
@keyframes fadeUp { from { opacity:0; transform:translateY(18px); } to { opacity:1; transform:translateY(0); } }
@keyframes growX { from { transform:scaleX(0); } to { transform:scaleX(1); } }
@keyframes popIn { from { opacity:0; transform:scale(0.85); } to { opacity:1; transform:scale(1); } }
details summary::-webkit-details-marker { display:none; }
details summary { list-style:none; }
:focus { outline:none; }
:focus-visible { outline:2px solid #1a5fa8; outline-offset:2px; }
input:focus, select:focus { border-color:#1a5fa8 !important; }
.sel { width:100%; font:inherit; font-size:14px; font-weight:500; padding:14px 40px 14px 16px; border:1px solid rgba(38,34,30,0.18); background-color:#f4f6f8; color:#1f2933; cursor:pointer; -webkit-appearance:none; appearance:none; background-image:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='14' height='9' viewBox='0 0 14 9'%3E%3Cpath d='M1 1l6 6 6-6' fill='none' stroke='%231a5fa8' stroke-width='2'/%3E%3C/svg%3E"); background-repeat:no-repeat; background-position:right 16px center; border-radius:0; }
.sel:invalid { color:#64717f; }
.bar-hidden { display:none; }
@media (prefers-reduced-motion: reduce) { * { animation:none !important; } }
</style>
</head>
<body>
<div style="max-width:430px;margin:0 auto;background:#ffffff;min-height:100vh;box-shadow:0 0 40px rgba(31,41,51,0.25)">

  <header style="display:flex;align-items:center;gap:10px;padding:12px 16px;background:rgba(255,255,255,0.96);border-bottom:1px solid rgba(31,41,51,0.12)">
    <a href="index.html" style="display:block;text-decoration:none"><img src="assets/logo-w-red.png" alt="W" style="height:24px;width:auto;display:block"></a>
    <div style="font-size:10px;line-height:1.5;color:#64717f;font-weight:500">経営者人脈から決裁者へ<br>直接つなぐ営業支援</div>
  </header>

  <div style="background:#1e2a35;padding:40px 24px;color:#eef2f6;position:relative;overflow:hidden">
    <div style="position:absolute;inset:0;background:none;pointer-events:none"></div>
    <div style="position:relative">
      <h1 style="font-size:25px;line-height:1.6;margin:0;font-weight:900;color:#f4f6f8;letter-spacing:0.02em">紹介できる決裁者が<br>いるか確認する</h1>
      <div style="width:52px;height:1px;background:#4a8ed0;margin:16px 0"></div>
      <p style="font-size:13px;line-height:2;color:#b9c3cd;margin:0">御社の商材に対して「いま課題のある決裁者」がいるかをお答えします。<br>1営業日以内に担当よりご連絡します。</p>
    </div>
  </div>

  <div style="padding:36px 24px 52px">
    <form id="wform" style="display:flex;flex-direction:column;gap:22px">
      <div>
        <label for="company" style="display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;margin-bottom:8px">会社名<span style="background:#1a5fa8;color:#fff;font-size:10px;font-weight:700;padding:1px 8px">必須</span></label>
        <input id="company" name="company" type="text" required placeholder="例：ラフ・メイカー株式会社" style="width:100%;font:inherit;font-size:15px;padding:14px 16px;border:1px solid rgba(31,41,51,0.18);background:#f4f6f8;color:#1f2933">
      </div>
      <div>
        <label for="name" style="display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;margin-bottom:8px">氏名<span style="background:#1a5fa8;color:#fff;font-size:10px;font-weight:700;padding:1px 8px">必須</span></label>
        <input id="name" name="name" type="text" required placeholder="例：山田 太郎" style="width:100%;font:inherit;font-size:15px;padding:14px 16px;border:1px solid rgba(31,41,51,0.18);background:#f4f6f8;color:#1f2933">
      </div>
      <div>
        <label for="email" style="display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;margin-bottom:8px">メールアドレス<span style="background:#1a5fa8;color:#fff;font-size:10px;font-weight:700;padding:1px 8px">必須</span></label>
        <input id="email" name="email" type="email" required placeholder="例：yamada@example.co.jp" style="width:100%;font:inherit;font-size:15px;padding:14px 16px;border:1px solid rgba(31,41,51,0.18);background:#f4f6f8;color:#1f2933">
      </div>
      <div>
        <label for="tel" style="display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;margin-bottom:8px">電話番号<span style="background:#1a5fa8;color:#fff;font-size:10px;font-weight:700;padding:1px 8px">必須</span></label>
        <input id="tel" name="tel" type="tel" required placeholder="例：03-1234-5678" style="width:100%;font:inherit;font-size:15px;padding:14px 16px;border:1px solid rgba(31,41,51,0.18);background:#f4f6f8;color:#1f2933">
      </div>
      <div>
        <label for="budget" style="display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;margin-bottom:8px">予算として年間300万円以上を確保できますか？<span style="background:#1a5fa8;color:#fff;font-size:10px;font-weight:700;padding:1px 8px;flex:none">必須</span></label>
        <select id="budget" name="budget" required class="sel">
          <option value="" disabled selected>選択してください</option>
          <option>はい</option>
          <option>いいえ</option>
        </select>
        <p style="font-size:11px;line-height:1.8;color:#1a5fa8;margin:8px 0 0">※誠に恐縮ながら、「いいえ」の場合は今回のご案内の対象外となります</p>
      </div>
      <div>
        <label for="issue" style="display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;margin-bottom:8px">現在、貴社が抱えている課題を教えてください<span style="background:#1a5fa8;color:#fff;font-size:10px;font-weight:700;padding:1px 8px;flex:none">必須</span></label>
        <select id="issue" name="issue" required class="sel">
          <option value="" disabled selected>選択してください</option>
          <option>売上が伸び悩んでいる／頭打ちになっている</option>
          <option>新規顧客・販路をうまく開拓できていない</option>
          <option>営業の人材・リソースが不足している</option>
          <option>マーケティング・ブランディングのやり方が分からない</option>
          <option>決裁者・キーマンとの人脈・つながりがない</option>
          <option>資金調達・PR・採用・DXなど経営全般に課題がある</option>
        </select>
      </div>
      <div>
        <label for="interest" style="display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;margin-bottom:8px">今回、特に興味を持たれた内容を教えてください<span style="background:#1a5fa8;color:#fff;font-size:10px;font-weight:700;padding:1px 8px;flex:none">必須</span></label>
        <select id="interest" name="interest" required class="sel">
          <option value="" disabled selected>選択してください</option>
          <option>いま課題のある決裁者とのマッチング・紹介</option>
          <option>代表・田口のマーケティングスキルを活用できる点</option>
          <option>企業800社・個人10,000社超のビジネス人脈</option>
          <option>ターゲットへのアプローチ代行</option>
          <option>資金調達・PR・人材・DXまで含む経営ブレインサポート</option>
          <option>粗利600万円の最低保障（下振れリスクの固定）</option>
        </select>
      </div>
      <div style="font-size:11px;line-height:1.9;color:#64717f;background:#f4f6f8;padding:14px 16px">
        送信いただいた情報は、お問い合わせ対応の目的にのみ使用します。詳しくは<a href="https://drive.google.com/file/d/1aoLPsLe9loWZZIPutqbFUnU6kxRVnT5W/view?usp=sharing" target="_blank" rel="noopener">プライバシーポリシー</a>をご確認ください。
      </div>
      <button type="submit" style="font-family:inherit;background:#1a5fa8;color:#fff;font-weight:900;font-size:17px;padding:18px 16px;border:none;border-radius:10px;cursor:pointer;letter-spacing:0.08em;box-shadow:0 12px 28px rgba(26,95,168,0.4), inset 0 1px 0 rgba(255,255,255,0.3)">この内容で確認する</button>
    </form>
    <div style="text-align:center;margin-top:30px">
      <a href="index.html" style="font-size:12px;color:#64717f">← LPに戻る</a>
    </div>
  </div>

  <footer style="padding:22px;background:#16202a;font-size:10px;color:#64717f;text-align:center">© ラフ・メイカー株式会社</footer>
</div>
<script>
(function(){
  var f = document.getElementById('wform');
  if (!f) return;
  f.addEventListener('submit', function(e){
    e.preventDefault();
    if (f.checkValidity()) location.href = 'thanks.html';
    else f.reportValidity();
  });
})();
</script>
</body>
</html>
