<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">

<meta property="og:title" content="無料で資料をダウンロード｜W">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&amp;family=Zen+Old+Mincho:wght@400;500;600;700;900&amp;display=swap">
<style>
body { margin:0; background:#e7e1d4; color:#45403a; font-family:"Zen Kaku Gothic New", system-ui, sans-serif; font-size:15px; line-height:1.95; letter-spacing:0.03em; font-feature-settings:"palt" 1; -webkit-font-smoothing:antialiased; }
* { box-sizing:border-box; }
img { max-width:100%; }
a { color:#a83c1c; }
h1, h2, h3, p, figure { margin:0; }
.wrap { max-width:430px; margin:0 auto; background:#f6f3ec; padding-bottom:92px; }
.mi { font-family:"Zen Old Mincho", "Noto Serif JP", serif; font-weight:700; font-feature-settings:"palt" 1; }
.h1 { font-family:"Zen Old Mincho", serif; font-size:39px; line-height:1.3; letter-spacing:-0.035em; color:#1b1814; font-weight:700; }
.h2 { font-family:"Zen Old Mincho", serif; font-size:28px; line-height:1.34; letter-spacing:-0.032em; color:#1b1814; font-weight:700; }
.h3 { font-family:"Zen Old Mincho", serif; font-size:20px; line-height:1.5; letter-spacing:-0.02em; color:#1b1814; font-weight:700; }
.lead { font-size:15px; line-height:2.05; color:#45403a; }
.sm { font-size:12.5px; line-height:1.9; color:#8a8377; letter-spacing:0.02em; }
.eyebrow { font-size:11px; letter-spacing:0.24em; font-weight:700; color:#8a8377; }
.num { font-family:"Zen Old Mincho", serif; font-weight:700; letter-spacing:-0.025em; line-height:1; color:#1b1814; }
.rule { height:1px; background:#ddd7ca; border:0; margin:0; }
.cta { display:block; background:#a83c1c; color:#fff7f0; text-decoration:none; text-align:center; font-weight:700; font-size:17px; letter-spacing:0.05em; padding:21px 16px; border-radius:2px; }
.cta:hover { background:#8c3115; color:#fff7f0; }
.ctab { display:block; background:#a83c1c; color:#fff7f0; text-decoration:none; text-align:center; font-weight:700; font-size:15px; letter-spacing:0.04em; padding:14px 12px; border-radius:2px; }
.ctab:hover { background:#8c3115; color:#fff7f0; }
section[id] { scroll-margin-top:60px; }
details summary::-webkit-details-marker { display:none; }
details summary { list-style:none; }
details.faq summary { position:relative; padding-right:28px; }
details.faq summary::after { content:"\002B"; position:absolute; right:2px; top:16px; font-size:17px; font-weight:400; color:#a83c1c; line-height:1; }
details.faq[open] summary::after { content:"\2212"; }
:focus { outline:none; }
:focus-visible { outline:2px solid #a83c1c; outline-offset:2px; }
.sel { width:100%; font:inherit; font-size:16px; padding:14px 38px 14px 14px; border:1px solid #ccc4b3; background-color:#fffdf8; color:#1b1814; cursor:pointer; -webkit-appearance:none; appearance:none; background-image:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='13' height='8' viewBox='0 0 13 8'%3E%3Cpath d='M1 1l5.5 5.5L12 1' fill='none' stroke='%23a83c1c' stroke-width='1.4'/%3E%3C/svg%3E"); background-repeat:no-repeat; background-position:right 14px center; border-radius:2px; }
.sel:invalid { color:#a49c8d; }
.inp { width:100%; font:inherit; font-size:16px; padding:14px; border:1px solid #ccc4b3; border-radius:2px; background:#fffdf8; color:#1b1814; }
.inp::placeholder { color:#b3ab9b; }
.inp:focus, .sel:focus { border-color:#a83c1c; }

.hscroll::-webkit-scrollbar { display:none; }
.bar-hidden { display:none; }

<body>
<div class="wrap" style="min-height:100vh;padding-bottom:0">
  <header style="display:flex;align-items:center;gap:12px;padding:11px 20px;background:#f6f3ec;border-bottom:1px solid #ddd7ca">
    <a href="index.html" style="display:block;text-decoration:none"><img src="assets/logo-w-gold.png" alt="W" style="height:22px;width:auto;display:block"></a>
    <div style="font-size:11px;line-height:1.7;color:#8a8377;letter-spacing:0.04em">粗利600万円 最低保証の<br>決裁者紹介サービス</div>
  </header>

  <section style="background:#f6f3ec;padding:44px 24px 40px">
    <div class="eyebrow" style="margin-bottom:20px">資料ダウンロード</div>
    <h1 class="h1" style="font-size:32px">無料で資料を<br>ダウンロード</h1>
    <p class="lead" style="margin-top:20px;max-width:344px">サービス内容・審査基準・保証の適用条件をまとめた資料をお送りします。1営業日以内に担当よりご連絡します。</p>
  </section>

  <div style="padding:36px 24px 52px;background:#fffdf8;border-top:1px solid #ddd7ca">
    <form id="wform" style="display:flex;flex-direction:column;gap:20px">
      <div>
        <label for="company" style="display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700;margin-bottom:7px;color:#1b1814">会社名<span style="background:#a83c1c;color:#fff7f0;font-size:11px;font-weight:700;padding:2px 7px;border-radius:2px;letter-spacing:0.06em">必須</span></label>
        <input id="company" name="company" type="text" required placeholder="例：ラフ・メイカー株式会社" class="inp">
      </div>
      <div>
        <label for="name" style="display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700;margin-bottom:7px;color:#1b1814">氏名<span style="background:#a83c1c;color:#fff7f0;font-size:11px;font-weight:700;padding:2px 7px;border-radius:2px;letter-spacing:0.06em">必須</span></label>
        <input id="name" name="name" type="text" required placeholder="例：山田 太郎" class="inp">
      </div>
      <div>
        <label for="email" style="display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700;margin-bottom:7px;color:#1b1814">メールアドレス<span style="background:#a83c1c;color:#fff7f0;font-size:11px;font-weight:700;padding:2px 7px;border-radius:2px;letter-spacing:0.06em">必須</span></label>
        <input id="email" name="email" type="email" required placeholder="例：yamada@example.co.jp" class="inp">
      </div>
      <div>
        <label for="tel" style="display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700;margin-bottom:7px;color:#1b1814">電話番号<span style="background:#a83c1c;color:#fff7f0;font-size:11px;font-weight:700;padding:2px 7px;border-radius:2px;letter-spacing:0.06em">必須</span></label>
        <input id="tel" name="tel" type="tel" required placeholder="例：03-1234-5678" class="inp">
      </div>
      <div>
        <label for="budget" style="display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700;margin-bottom:7px;color:#1b1814">年間300万円の投資枠を確保できますか？<span style="background:#a83c1c;color:#fff7f0;font-size:11px;font-weight:700;padding:2px 7px;border-radius:2px;flex:none;letter-spacing:0.06em">必須</span></label>
        <select id="budget" name="budget" required class="sel">
          <option value="" disabled selected>選択してください</option>
          <option>はい</option>
          <option>いいえ</option>
        </select>
        <p class="sm" style="margin-top:7px">※ 恐れ入りますが、「いいえ」の場合は今回のご案内の対象外となります。</p>
      </div>
      <div>
        <label for="issue" style="display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700;margin-bottom:7px;color:#1b1814">いま抱えている課題を教えてください<span style="background:#a83c1c;color:#fff7f0;font-size:11px;font-weight:700;padding:2px 7px;border-radius:2px;flex:none;letter-spacing:0.06em">必須</span></label>
        <select id="issue" name="issue" required class="sel">
          <option value="" disabled selected>選択してください</option>
          <option>売上が伸び悩んでいる／頭打ちになっている</option>
          <option>新規顧客・販路をうまく開拓できていない</option>
          <option>営業の人材・リソースが不足している</option>
          <option>マーケティング・ブランディングのやり方が分からない</option>
          <option>決裁者・キーマンとの人脈・つながりがない</option>
          <option>資金調達・PR・採用・DXなど経営全般に課題がある</option>
        </select>
      </div>
      <div>
        <label for="interest" style="display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700;margin-bottom:7px;color:#1b1814">特に興味を持たれた内容を教えてください<span style="background:#a83c1c;color:#fff7f0;font-size:11px;font-weight:700;padding:2px 7px;border-radius:2px;flex:none;letter-spacing:0.06em">必須</span></label>
        <select id="interest" name="interest" required class="sel">
          <option value="" disabled selected>選択してください</option>
          <option>ニーズを確認済みの決裁者とのマッチング・紹介</option>
          <option>代表・田口のマーケティングスキルを活用できる点</option>
          <option>15年で築いた18,000社のビジネス人脈</option>
          <option>ターゲットへのアプローチ代行</option>
          <option>資金調達・PR・人材・DXまで含む経営ブレインサポート</option>
          <option>粗利600万円の最低保証（下振れリスクの固定）</option>
        </select>
      </div>
      <p class="sm" style="border-top:1px solid #e6e0d3;padding-top:14px">送信いただいた情報は、お問い合わせ対応の目的にのみ使用します。詳しくは<a href="https://drive.google.com/file/d/1aoLPsLe9loWZZIPutqbFUnU6kxRVnT5W/view?usp=sharing" target="_blank" rel="noopener">プライバシーポリシー</a>をご確認ください。</p>
      <button type="submit" class="cta" style="font-family:inherit;width:100%;border:none;cursor:pointer">無料で資料を受け取る</button>
      <p class="sm" style="text-align:center">入力は30秒。ご相談・審査まで費用はかかりません。</p>
    </form>
    <div style="text-align:center;margin-top:30px">
      <a href="index.html" style="font-size:13px;color:#8a8377;text-decoration:none;border-bottom:1px solid #ddd7ca;padding-bottom:2px">サービス内容のページに戻る</a>
    </div>
  </div>

  <footer style="padding:26px 24px;background:#16130f;font-size:11.5px;color:#6f6759;text-align:center">&copy; ラフ・メイカー株式会社</footer>
</div>
<script>
(function(){
  var f = document.getElementById('wform');
  if (!f) return;
  f.addEventListener('submit', function(e){
    e.preventDefault();
    if (f.checkValidity()) location.href = 'thanks.html';
    else f.reportValidity();
  });
})();
</script>
</body>
</html>
